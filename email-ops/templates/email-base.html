<!DOCTYPE html>
<!--
  Email base skeleton. Every email starts from this file (or from the <head> of the brand's components.html, which already carries the brand tokens).
  Rules: email-ops/rules.md  ·  Flow: email-ops/playbook.md
  Replace every {{TOKEN_*}} with the value in the brand kit (email-kit/tokens.json).
  Modules go between the MODULES markers, copied verbatim from the brand's components.html.
  Top comment of a real email must carry these lines (read by tools/build_preview.py):
    Subject:   ...
    Preheader: ...
    Modules:   ...
    Button:    ...
-->
<html lang="{{LANG}}" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{SUBJECT}}</title>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <style>body, table, td, p, a, h1, h2, h3 { font-family: {{TOKEN_FONT_FALLBACK}} !important; }</style>
  <![endif]-->
  <!-- Web font: progressive enhancement only (Apple Mail, iOS, some Android). -->
  <link href="{{TOKEN_FONT_URL}}" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
    u + #body a { color: inherit; text-decoration: none; }

    @media screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 24px !important; padding-right: 24px !important; }
      .py { padding-top: 40px !important; padding-bottom: 40px !important; }
      .stack { display: block !important; width: 100% !important; max-width: 100% !important; }
      .fluid { width: 100% !important; height: auto !important; }
      .h1 { font-size: 32px !important; line-height: 38px !important; }
      .btn-full, .btn-full a { display: block !important; width: 100% !important; box-sizing: border-box; }
      .hide-mobile { display: none !important; max-height: 0 !important; overflow: hidden !important; }
    }

    /* Dark mode: Apple Mail / iOS. Outlook app uses [data-ogsc] / [data-ogsb]. Gmail ignores both. */
    @media (prefers-color-scheme: dark) {
      .dm-bg { background-color: {{TOKEN_DARK_BG}} !important; }
      .dm-text { color: {{TOKEN_DARK_TEXT}} !important; }
      .logo-light { display: none !important; max-height: 0 !important; overflow: hidden !important; }
      .logo-dark { display: block !important; max-height: none !important; }
    }
    [data-ogsb] .dm-bg { background-color: {{TOKEN_DARK_BG}} !important; }
    [data-ogsc] .dm-text { color: {{TOKEN_DARK_TEXT}} !important; }
  </style>
</head>
<body id="body" style="margin:0; padding:0; background-color:{{TOKEN_PAGE_BG}};">
  <!-- Preheader: shown in inbox preview, hidden in the body. -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:{{TOKEN_PAGE_BG}};">
    {{PREHEADER}}
    &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:{{TOKEN_PAGE_BG}};" class="dm-bg">
    <tr>
      <td align="center" style="padding:0;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:{{TOKEN_SURFACE}};">

          <!-- MODULES:START -->

          <!-- MODULES:END -->

        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
