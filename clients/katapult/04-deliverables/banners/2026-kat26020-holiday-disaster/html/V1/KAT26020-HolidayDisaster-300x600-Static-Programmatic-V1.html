.k20-mid{display:flex;align-items:center}
/* full-bleed layout: the headline sits on the photo as solid label strips, so it reads on
   any part of the picture. Setup on a White strip, punchline in Pink on a Dark Blue strip. */
.k20-h{margin:0;font-weight:700;line-height:1;letter-spacing:-.025em;white-space:nowrap}
.k20-h > span{display:block;width:max-content;padding:.07em .2em .11em}
.k20-h .t1{background:#FFFFFF;color:#131540}
.k20-h .t2{background:#131540;color:#ED5370}
.k20-cta{display:inline-flex;align-items:center;justify-content:center;text-align:center;border-radius:999px;background:#ED5370;color:#FFFFFF;font-weight:500;line-height:1.15;letter-spacing:-.005em;white-space:nowrap}
.k20-cta.wrap{white-space:normal;text-wrap:balance}
.k20-disc{margin:0;font-weight:500;line-height:1.2;color:#FFFFFF}
.k20-disc > span{display:block;text-wrap:balance}

/* the photo fills the frame (or the right panel on the leaderboards); the fade melts it into
   solid Dark Blue where the logo, CTA and disclaimer sit, so the logo is never on the photo */
.k20-pic{overflow:hidden;background:#282B60}
.k20-pic img{position:absolute;display:block;max-width:none}
.k20-fade{pointer-events:none}
