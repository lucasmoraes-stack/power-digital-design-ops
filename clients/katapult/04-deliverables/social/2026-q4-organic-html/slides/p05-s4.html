/* ============ Brand tokens (never change with theme) ============ */
:root{
  --k-pink:#ED5370;
  --k-logo-pink:#EC5370; /* the supplied logo artwork's own pink, logo only */
  --k-dark-blue:#131540;
  --k-blue:#365488;
  --k-light-blue:#9EB5C0;
  --k-orange:#E48027;
  --k-cream:#D4A574;
  --k-grey-dark:#4D4D4D;
  --k-grey-medium:#808285;
  --k-grey:#A4A4A4;
  --k-grey-light:#D8D8D8;
  --k-grey-lightest:#F0F0F0;
  --k-white:#FFFFFF;
  --k-black:#000000;
  --k-surface:#EAEAE8; /* template surface from the Figma meta templates */

  --font-brand:"Aktiv Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;

  /* page chrome, light */
  --bg:#F5F5F3;
  --panel:#FFFFFF;
  --ink:#131540;
  --ink-2:#4D4D4D;
  --rule:#D8D8D8;
  --rule-strong:#A4A4A4;
  --accent:#ED5370;
  --code-bg:#F0F0F0;
  --focus:#131540;
  --ok-bg:#E3EEE6; --ok-ink:#1E4D2B;
  --lg-bg:#F4E8D6; --lg-ink:#6B4210;
  --no-bg:#F7DDE2; --no-ink:#7A1F31;
  --gutter:clamp(16px,4vw,48px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D0E2C;
    --panel:#131540;
    --ink:#F0F0F0;
    --ink-2:#C8C9CF;
    --rule:#2B2E62;
    --rule-strong:#4A4E86;
    --code-bg:#171A4A;
    --focus:#ED5370;
    --ok-bg:#16382A; --ok-ink:#BFE5CB;
    --lg-bg:#3E2E14; --lg-ink:#F2D7A8;
    --no-bg:#43182A; --no-ink:#F7C4CF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D0E2C;
  --panel:#131540;
  --ink:#F0F0F0;
  --ink-2:#C8C9CF;
  --rule:#2B2E62;
  --rule-strong:#4A4E86;
  --code-bg:#171A4A;
  --focus:#ED5370;
  --ok-bg:#16382A; --ok-ink:#BFE5CB;
  --lg-bg:#3E2E14; --lg-ink:#F2D7A8;
  --no-bg:#43182A; --no-ink:#F7C4CF;
}

/* ============ Page chrome ============ */
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-brand);font-weight:300;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:2px}
h1,h2,h3,h4{font-weight:500;margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
ul{margin:0;padding-left:1.1em}
code,.mono{font-family:var(--font-mono);font-size:.86em}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:var(--gutter)}
.label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.prose{max-width:66ch}
div.prose{display:flex;flex-direction:column;gap:10px}

.masthead{background:var(--k-dark-blue);color:var(--k-white);position:relative;overflow:hidden}
.masthead .wrap{position:relative;z-index:1;padding-block:56px 44px;display:flex;flex-direction:column;gap:18px}
.masthead h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.015em;line-height:1}
.masthead h1 span{color:var(--k-pink)}
.masthead p{max-width:60ch;color:var(--k-grey-light);font-size:17px}
.masthead .meta{max-width:min(100%,700px);display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--k-light-blue);font-weight:500}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.nav ul{list-style:none;padding:0;display:flex;gap:4px 20px;flex-wrap:nowrap;overflow-x:auto;padding-block:12px;scrollbar-width:thin}
.nav a{font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;padding-block:4px;border-bottom:2px solid transparent}
.nav a:hover{border-bottom-color:var(--accent)}

main{display:flex;flex-direction:column}
section.block{padding-block:56px;border-bottom:1px solid var(--rule)}
section.block > .wrap{display:flex;flex-direction:column;gap:28px}
.block-head{display:flex;flex-direction:column;gap:10px}
.block-head h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.01em}
h3{font-size:19px;font-weight:700}
.sub-block{display:flex;flex-direction:column;gap:16px}

.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px 32px}
.status-item{display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:3px solid var(--rule-strong)}
.status-item.open{border-top-color:var(--accent)}
.status-item h3{font-size:16px}
.status-item p{font-size:15px}

.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:3px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok-ink)}
.tag.lg{background:var(--lg-bg);color:var(--lg-ink)}
.tag.no{background:var(--no-bg);color:var(--no-ink)}

/* color */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}
.swatches.primary{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sw{display:flex;flex-direction:column;gap:8px}
.sw .chip{height:96px;border-radius:4px;border:1px solid var(--rule)}
.swatches.primary .chip{height:150px}
.sw b{font-weight:700;font-size:15px}
.sw .hex{font-family:var(--font-mono);font-size:13px}
.sw .role{font-size:14px;color:var(--ink-2);line-height:1.4}

.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14.5px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);background:var(--code-bg)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.pair{display:inline-flex;align-items:center;justify-content:center;width:76px;height:40px;border-radius:3px;font-weight:500;font-size:20px;border:1px solid rgba(0,0,0,.08)}

/* type */
.type-rows{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.type-row{display:grid;grid-template-columns:200px 1fr;gap:12px 32px;padding-block:18px;border-bottom:1px solid var(--rule);align-items:baseline}
.type-row .spec{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.type-row .spec b{font-size:15px;font-weight:700}
.type-row .spec .mono{color:var(--ink-2)}
.type-row .sample{color:var(--ink);min-width:0;overflow-wrap:anywhere}
.weights{display:flex;flex-wrap:wrap;gap:12px 40px}
.weights div{display:flex;flex-direction:column;gap:2px}
.weights .big{font-size:44px;line-height:1}

/* logo */
.logo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.logo-tile{display:flex;flex-direction:column;gap:10px}
.logo-tile .stage{height:150px;display:grid;place-items:center;border-radius:4px;border:1px solid var(--rule)}
.logo-art{display:block;width:200px;max-width:80%;height:auto;aspect-ratio:521/116;fill:currentColor}
.clear-demo{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center}
.clear-box{position:relative;flex:none;box-sizing:content-box;padding:var(--xh);border:1px dashed var(--rule-strong);background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(237,83,112,.12) 6px 7px)}
.clear-box .logo-art{max-width:none;background:var(--bg)}
.clear-box .xh-mark{position:absolute;left:calc(var(--xh) / 2 - 2px);width:8px;border:1.5px solid var(--ink-2);border-right:0}
.clear-box .x{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:var(--ink-2)}
.clear-box .x[style*="right"]{transform:translate(50%,-50%)}
.clear-box .x[style*="bottom"]{transform:translate(-50%,50%)}
.min-demo{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.min-item{display:flex;flex-direction:column;gap:10px}
.min-item .stage{height:120px;display:grid;place-items:center;border-radius:4px;border:1px solid var(--rule)}
.min-item .logo-art{max-width:none}
.logo-map td,.logo-map th{text-align:left}
.dodont{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px 40px}
.dodont h3{display:flex;align-items:center;gap:10px}
.dodont ul{display:flex;flex-direction:column;gap:6px}

/* shapes (v2 section) */

/* photo / icons */
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px 48px}
.list-tight{display:flex;flex-direction:column;gap:6px}
.bg-chips{display:flex;flex-wrap:wrap;gap:10px}
.bg-chips span{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.bg-chips i{width:22px;height:22px;border-radius:3px;border:1px solid rgba(0,0,0,.12);display:inline-block}
.icon-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.icon-tile{display:flex;flex-direction:column;gap:8px}
.icon-tile .stage{height:120px;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:18px;border:1px solid var(--rule)}
.icon-tile svg{width:52px;height:52px}
.neg{display:flex;flex-wrap:wrap;gap:8px}
.neg span{font-size:13.5px;font-weight:500;border:1px solid var(--rule-strong);border-radius:3px;padding:3px 9px}

/* voice */
.voice{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.voice-col{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:3px solid var(--k-pink)}
.voice-col q{display:block;font-size:19px;font-weight:500;line-height:1.3;quotes:none}
.voice-col .lines{display:flex;flex-direction:column;gap:12px}
.fixed-lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 32px}
.fixed-lines div{display:flex;flex-direction:column;gap:4px}
.fixed-lines q{quotes:none;font-weight:500;font-size:17px}

/* handoff */
pre{margin:0;background:var(--code-bg);border:1px solid var(--rule);border-radius:4px;padding:16px 18px;overflow-x:auto;font-family:var(--font-mono);font-size:13px;line-height:1.55;color:var(--ink)}

/* ============ Preview scaffolding ============ */
.preview-row{display:flex;gap:24px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.preview{display:flex;flex-direction:column;gap:8px;flex:none}
.preview figcaption{display:flex;flex-direction:column;gap:2px;font-size:13px;max-width:330px}
.preview figcaption b{font-weight:700}
.preview figcaption .mono{color:var(--ink-2);font-size:12px}
figure{margin:0}
.kp-frame{--s:.3;width:calc(1080px * var(--s));height:calc(var(--fh) * var(--s));overflow:hidden;flex:none;outline:1px solid var(--rule)}
.kp-frame.f-1x1{--fh:1080px}
.kp-frame.f-4x5{--fh:1350px}
.kp-frame.f-9x16{--fh:1920px}
.kp-frame > .kp-post,.kp-frame > .fmt{transform:scale(var(--s));transform-origin:0 0}
.tpl-block{display:flex;flex-direction:column;gap:16px;padding-top:28px;border-top:1px solid var(--rule)}
.tpl-head{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
.tpl-head h3{font-size:22px;font-weight:500}
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--k-pink)}

/* ============ Format diagrams (canvas px) ============ */
.fmt{position:relative;width:1080px;height:var(--fh);background:var(--k-surface);font-family:var(--font-brand);color:var(--k-dark-blue)}
.fmt .band{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(19,21,64,.13) 0 14px,rgba(19,21,64,.05) 14px 28px);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;text-align:center;line-height:1.2;padding:0 40px}
.fmt .band.side{top:0;bottom:0;left:auto;right:0;width:120px;writing-mode:vertical-rl;font-size:30px}
.fmt .safe{position:absolute;border:5px dashed var(--k-pink)}
.fmt .zone{position:absolute;border:4px solid var(--k-dark-blue);background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;text-align:center;line-height:1.15}
.fmt .zone.cta{border-radius:999px}
.fmt .dim{position:absolute;font-size:30px;font-weight:700;color:var(--k-pink);background:var(--k-surface);padding:0 8px}

/* =================================================================
   KATAPULT POST SYSTEM  (clone these for the 15 posts)
   Canvas: 1080 wide. Ratio classes set height + safe zones.
   Theme classes recolor the whole system together.
   ================================================================= */
.kp-post{
  --kp-bg:var(--k-surface);
  --kp-ink:var(--k-black);
  --kp-sub:var(--k-dark-blue);
  --kp-logo:var(--k-logo-pink);
  --kp-pill-stroke:var(--k-pink);
  --kp-pill-ink:var(--k-black);
  --kp-check:var(--k-pink);
  --kp-cta-bg:var(--k-pink);
  --kp-cta-ink:var(--k-dark-blue);
  --kp-disc:var(--k-black);
  ;
  --kp-slot-bg:var(--k-grey-light);
  --kp-slot-ink:var(--k-grey-dark);
  position:relative;width:1080px;height:var(--kp-h);overflow:hidden;
  background:var(--kp-bg);color:var(--kp-ink);font-family:var(--font-brand);font-weight:300;line-height:1.3;
  -webkit-font-smoothing:antialiased;
}
/* ratios: canvas height, essential-content safe zone, type sizes */
.kp-r-1x1{--kp-h:1080px;--kp-safe-top:80px;--kp-safe-bottom:80px;--kp-safe-x:80px;--kp-h1:80px;--kp-sub-size:38px;--kp-disc-size:18px;--kp-logo-w:240px}
.kp-r-4x5{--kp-h:1350px;--kp-safe-top:90px;--kp-safe-bottom:90px;--kp-safe-x:80px;--kp-h1:88px;--kp-sub-size:40px;--kp-disc-size:20px;--kp-logo-w:250px}
.kp-r-9x16{--kp-h:1920px;--kp-safe-top:250px;--kp-safe-bottom:420px;--kp-safe-x:120px;--kp-h1:96px;--kp-sub-size:42px;--kp-disc-size:22px;--kp-logo-w:280px}

/* themes (color variations from the Figma meta templates) */
.kp-theme-light{}
.kp-theme-darkblue{--kp-bg:var(--k-dark-blue);--kp-ink:var(--k-white);--kp-sub:var(--k-light-blue);--kp-logo:var(--k-logo-pink);--kp-pill-stroke:var(--k-pink);--kp-pill-ink:var(--k-white);--kp-check:var(--k-pink);--kp-cta-bg:var(--k-pink);--kp-cta-ink:var(--k-dark-blue);--kp-disc:var(--k-grey-light)}
.kp-theme-pink{--kp-bg:var(--k-pink);--kp-ink:var(--k-dark-blue);--kp-sub:var(--k-dark-blue);--kp-logo:var(--k-white);--kp-pill-stroke:var(--k-white);--kp-pill-ink:var(--k-dark-blue);--kp-check:var(--k-white);--kp-cta-bg:var(--k-dark-blue);--kp-cta-ink:var(--k-white);--kp-disc:var(--k-dark-blue)}
.kp-theme-cream{--kp-bg:var(--k-cream);--kp-ink:var(--k-dark-blue);--kp-sub:var(--k-dark-blue);--kp-logo:var(--k-dark-blue);--kp-pill-stroke:var(--k-dark-blue);--kp-pill-ink:var(--k-dark-blue);--kp-check:var(--k-dark-blue);--kp-cta-bg:var(--k-dark-blue);--kp-cta-ink:var(--k-white);--kp-disc:var(--k-dark-blue)}

/* shared elements */
.kp-headline{margin:0;font-weight:500;font-size:var(--kp-h1);line-height:1.04;letter-spacing:-.012em;color:var(--kp-ink);text-wrap:balance}
.kp-sub{margin:0;font-weight:700;font-size:var(--kp-sub-size);line-height:1.2;color:var(--kp-sub);text-wrap:balance}
.kp-tagline{margin:0;font-weight:500;font-size:var(--kp-sub-size);line-height:1.2;letter-spacing:.02em;text-transform:uppercase;color:var(--kp-sub)}
.kp-theme-darkblue .kp-tagline--pink{color:var(--k-pink)} /* Brand Guardian ruling 2026-09-28: pink tagline only on Dark Blue (5.02:1); on the light surface it stays Dark Blue */
.kp-disclaimer{margin:0;font-weight:500;font-size:var(--kp-disc-size);line-height:1.3;color:var(--kp-disc);text-wrap:pretty}
.kp-disclaimer--on-image{color:var(--k-white);-webkit-text-stroke:.6px var(--k-black);paint-order:stroke fill}
.kp-cta{display:inline-flex;align-items:center;justify-content:center;flex:none;height:88px;padding:0 52px;border-radius:999px;background:var(--kp-cta-bg);color:var(--kp-cta-ink);font-weight:700;font-size:34px;line-height:1}
.kp-logo{flex:none;display:block;width:var(--kp-logo-w);height:auto;aspect-ratio:521/116;color:var(--kp-logo);fill:currentColor;overflow:visible;--kp-logo-cs:calc(var(--kp-logo-w) * 66.51 / 521)} /* supplied artwork via #k-logo; --kp-logo-cs = x-height = clear space */
.kp-inner > .kp-logo:not(:last-child){margin-bottom:max(0px,calc(var(--kp-logo-cs) - 24px))}
.kp-tpl-benefits .kp-body > .kp-logo{margin-block:max(0px,calc(var(--kp-logo-cs) - 26px))}
.kp-r-9x16.kp-tpl-benefits .kp-body > .kp-logo{margin-top:0}
.kp-tpl-hero .kp-copy > .kp-logo:not(:last-child){margin-bottom:max(0px,calc(var(--kp-logo-cs) - 28px))}
.kp-pills{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;width:min(100%,600px)}
.kp-pill{display:flex;align-items:center;gap:26px;height:76px;padding:0 40px;border:5px solid var(--kp-pill-stroke);border-radius:999px;color:var(--kp-pill-ink);font-weight:700;font-size:32px;text-align:left}
.kp-check{width:42px;height:42px;flex:none;color:var(--kp-check)}
.kp-slot{background:var(--kp-slot-bg);color:var(--kp-slot-ink);display:grid;place-items:center;text-align:center;font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;line-height:1.35;padding:24px}

/* safe-zone overlay (review only, never exported) */
.show-safe .kp-post::after{content:"";position:absolute;z-index:20;top:var(--kp-safe-top);bottom:var(--kp-safe-bottom);left:var(--kp-safe-x);right:var(--kp-safe-x);outline:6px dashed #00A3FF;box-shadow:0 0 0 2400px rgba(0,120,255,.16);pointer-events:none}

/* ---- Template A: .kp-tpl-benefits (Figma meta 2: photo edge + headline + 3 pills + logo) ---- */

.kp-r-9x16.kp-tpl-hero{--t-hero-top:780px}

.kp-r-9x16.kp-tpl-product-row .kp-products .kp-slot:first-child{grid-column:1 / -1;aspect-ratio:3/1}

/* ---- Template D: .kp-tpl-top-card (Figma 251:480 template-06 top block over rounded card) ---- */
.kp-tpl-top-card .kp-inner{position:absolute;top:var(--kp-safe-top);bottom:var(--kp-safe-bottom);left:var(--kp-safe-x);right:var(--kp-safe-x);display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}

/* =================================================================
   CAROUSEL AND STORY PATTERNS  (N1 to N9, added 2026-09-28)
   Carousel slides: .kp-r-4x5 + .kp-slide + one pattern class, and the
   SAME theme class on every slide of a carousel.
   Story poll: .kp-r-9x16 + .kp-tpl-story-poll (Stories safe bottom 250).
   Sized for client copy as written: headlines up to about 63 characters
   (four lines at 88px), subtexts up to about 190 characters.
   No text-transform on headlines, subtexts or options: case stays as typed.
   Content of every 4:5 slide ends above 990px so the lower band
   (1000 to 1170) and the optional disclaimer (bottom safe line) stay clear.
   ================================================================= */
.kp-post{--kp-body-size:36px;--kp-display:var(--kp-h1);--kp-num:var(--k-dark-blue);--kp-seam-top:1000px;font-family:var(--font-brand),"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
.kp-r-4x5{--kp-display:104px}
.kp-r-9x16{--kp-display:104px;--kp-body-size:38px}
.kp-post.kp-theme-darkblue{--kp-num:var(--k-pink)}
.kp-post.kp-theme-pink{--kp-num:var(--k-white)}

/* shared pieces */
.kp-text{margin:0;font-weight:300;font-size:var(--kp-body-size);line-height:1.3;color:var(--kp-ink);text-wrap:pretty}
.kp-headline.kp-display{font-size:var(--kp-display);line-height:1;letter-spacing:-.015em}
.kp-icon-slot{flex:none;width:160px;height:160px;border:4px dashed var(--kp-sub);border-radius:50%;color:var(--kp-sub);display:grid;place-items:center;text-align:center;font-weight:700;font-size:18px;line-height:1.2;letter-spacing:.05em;text-transform:uppercase;padding:18px}
.kp-slide .kp-disclaimer{position:absolute;left:var(--kp-safe-x);right:var(--kp-safe-x);bottom:var(--kp-safe-bottom)}

/* N1 .kp-slide-cover: logo, headline, subtext */
.kp-slide-cover .kp-inner{position:absolute;top:var(--kp-safe-top);left:var(--kp-safe-x);right:var(--kp-safe-x);display:flex;flex-direction:column;align-items:flex-start;gap:30px}
.kp-slide-cover--split{display:flex;flex-direction:column}
.kp-slide-cover--split .kp-inner{position:relative;top:auto;left:auto;right:auto;flex:none;margin:var(--kp-safe-top) var(--kp-safe-x) 0}
.kp-slide-cover--split .kp-photo{flex:1 1 auto;min-height:360px;margin-top:50px}

/* N2 .kp-slide-step: numeral, icon, title, subtext */
.kp-slide-step .kp-num{position:absolute;top:var(--kp-safe-top);left:var(--kp-safe-x);margin:0;font-weight:500;font-size:200px;line-height:.8;letter-spacing:-.03em;color:var(--kp-num);font-variant-numeric:lining-nums}
.kp-slide-step .kp-icon-slot{position:absolute;top:var(--kp-safe-top);right:var(--kp-safe-x)}
.kp-slide-step .kp-inner{position:absolute;top:300px;left:var(--kp-safe-x);right:var(--kp-safe-x);display:flex;flex-direction:column;gap:24px}

/* N3 .kp-slide-compare: two neutral columns, or --paired (one side per slide) */
.kp-slide-compare .kp-inner{position:absolute;top:var(--kp-safe-top);left:var(--kp-safe-x);right:var(--kp-safe-x);display:flex;flex-direction:column;gap:40px}
.kp-cols{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:stretch}
.kp-col{display:flex;flex-direction:column;gap:22px;min-width:0;padding:44px 40px;border:5px solid var(--kp-pill-stroke);border-radius:36px}
.kp-col .kp-icon-slot{width:120px;height:120px;font-size:15px;padding:12px}
.kp-slide-compare--paired .kp-inner{bottom:calc(var(--kp-h) - var(--kp-seam-top) + 10px)}
.kp-slide-compare--paired .kp-col{flex:1 1 auto;gap:28px;padding:56px 60px}
.kp-pair{display:flex;gap:14px}
.kp-pair i{width:24px;height:24px;border-radius:50%;border:4px solid var(--kp-sub)}
.kp-pair i.on{background:var(--kp-sub)}

/* N4 .kp-slide-statement: type only, Super graphic across the top */
.kp-slide-statement .kp-inner{position:absolute;left:var(--kp-safe-x);right:var(--kp-safe-x);bottom:var(--kp-safe-bottom);display:flex;flex-direction:column;align-items:flex-start;gap:28px}
.kp-slide-statement .kp-disclaimer{position:static;margin-top:20px}

/* N5 .kp-slide-stat: one large number, title, subtext, source line */
.kp-slide-stat .kp-inner{position:absolute;top:var(--kp-safe-top);left:var(--kp-safe-x);right:var(--kp-safe-x);display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.kp-stat-num{margin:0;font-weight:500;font-size:300px;line-height:.86;letter-spacing:-.035em;color:var(--kp-num);font-variant-numeric:lining-nums;white-space:nowrap}
.kp-stat-source{margin:0;font-weight:500;font-size:var(--kp-disc-size);line-height:1.3;color:var(--kp-sub)}

/* N6 .kp-slide-flow: the whole journey on one slide, nodes only */
.kp-slide-flow .kp-inner{position:absolute;top:var(--kp-safe-top);bottom:var(--kp-safe-bottom);left:var(--kp-safe-x);right:var(--kp-safe-x);display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.kp-flow{position:relative;flex:none;width:920px;height:470px;margin-top:auto}
.kp-flow-steps{list-style:none;margin:0;padding:0}
.kp-flow-step{position:absolute;left:calc(var(--x) - 100px);top:calc(var(--y) - 38px);width:200px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.kp-flow-node{width:76px;height:76px;border-radius:50%;background:var(--kp-cta-bg);color:var(--kp-cta-ink);display:grid;place-items:center;font-weight:700;font-size:36px;line-height:1}
.kp-flow-node:empty{width:36px;height:36px;margin-block:20px}
.kp-flow-label{font-weight:700;font-size:30px;line-height:1.15;color:var(--kp-ink);text-wrap:balance}
.kp-slide-flow .kp-disclaimer{position:static}

/* N7 .kp-slide-close: logo, headline, CTA pill */
.kp-slide-close .kp-inner{position:absolute;top:var(--kp-safe-top);bottom:calc(var(--kp-h) - var(--kp-seam-top));left:var(--kp-safe-x);right:var(--kp-safe-x);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;text-align:center}
.kp-slide-close .kp-disclaimer{text-align:center}

/* N8 .kp-tpl-prompt: fill-in-the-blank static, the prompt line renders as typed, underscores included */
.kp-tpl-prompt .kp-inner{position:absolute;top:var(--kp-safe-top);bottom:var(--kp-safe-bottom);left:var(--kp-safe-x);right:var(--kp-safe-x);display:flex;flex-direction:column;align-items:flex-start;gap:28px}
.kp-tpl-prompt .kp-headline{margin-top:130px}
.kp-prompt-card{align-self:stretch;display:flex;flex-direction:column;gap:20px;margin-top:8px;padding:46px 52px;border:5px solid var(--kp-pill-stroke);border-radius:36px}
.kp-prompt-line{margin:0;font-weight:500;font-size:66px;line-height:1.32;letter-spacing:-.01em;color:var(--kp-ink);text-wrap:balance}
.kp-tpl-prompt .kp-disclaimer{margin-top:auto}

/* N9 .kp-tpl-story-poll: 9:16 art around an empty zone for the native sticker */
.kp-r-9x16.kp-tpl-story-poll{--kp-safe-bottom:250px}
.kp-tpl-story-poll .kp-inner{position:absolute;top:var(--kp-safe-top);bottom:var(--kp-safe-bottom);left:var(--kp-safe-x);right:var(--kp-safe-x);display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.kp-options{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:16px;width:100%}
.kp-option{display:inline-flex;align-items:center;justify-content:center;max-width:100%;min-height:68px;padding:8px 34px;border:5px solid var(--kp-pill-stroke);border-radius:999px;color:var(--kp-pill-ink);font-weight:700;font-size:30px;line-height:1.15;text-wrap:balance}
.kp-sticker-zone{flex:1 1 auto;min-height:300px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;border:5px dashed var(--kp-ink);border-radius:36px;color:var(--kp-ink);font-weight:700;font-size:30px;line-height:1.25}
.kp-sticker-zone small{max-width:30ch;font-weight:500;font-size:24px;color:var(--kp-sub)}
.kp-tpl-story-poll .kp-disclaimer{margin-top:auto}
/* on export add .kp-export to the article: the zone stays empty, outline and label disappear */
.kp-export .kp-sticker-zone{border-color:transparent}
.kp-export .kp-sticker-zone > *{visibility:hidden}

/* preview scaffolding: carousel strip, slides edge to edge */
.kp-strip{display:flex;overflow-x:auto;padding-bottom:10px}
.kp-strip .kp-frame{--s:.25}
.strip-fig{display:flex;flex-direction:column;gap:10px;min-width:0}
.strip-fig figcaption{display:flex;flex-direction:column;gap:2px;font-size:13px}
.strip-fig figcaption b{font-weight:700}

/* =================================================================
   V2 COMPONENTS  (2026-09-28, after the account lead's review)
   No Bounce line graphics anywhere: motion comes from composition.
   Slide skeleton: article.kp-post.kp-v2 > .kp-bg (optional, full bleed)
   + .kp-lay (safe area, flex column) > .kp-track?, .kp-logo?,
   .kp-copy, .kp-stage (the visual, fills the space left by the copy).
   Stage children are placed in container units (cqw / cqh), so a
   composition scales to whatever room the client copy leaves.
   Text only ever sits on the post ground or inside a solid .kp-ui card.
   ================================================================= */
.kp-theme-blue{--kp-bg:var(--k-blue);--kp-ink:var(--k-white);--kp-sub:var(--k-white);--kp-logo:var(--k-white);--kp-pill-stroke:var(--k-white);--kp-pill-ink:var(--k-white);--kp-check:var(--k-white);--kp-cta-bg:var(--k-pink);--kp-cta-ink:var(--k-dark-blue);--kp-disc:var(--k-white);--kp-num:var(--k-white)}
.kp-theme-orange{--kp-bg:var(--k-orange);--kp-ink:var(--k-dark-blue);--kp-sub:var(--k-dark-blue);--kp-logo:var(--k-dark-blue);--kp-pill-stroke:var(--k-dark-blue);--kp-pill-ink:var(--k-dark-blue);--kp-check:var(--k-dark-blue);--kp-cta-bg:var(--k-dark-blue);--kp-cta-ink:var(--k-white);--kp-disc:var(--k-dark-blue);--kp-num:var(--k-dark-blue)}

.kp-v2{--kp-lay-gap:34px}
.kp-v2 .kp-bg{position:absolute;inset:0;z-index:0}
.kp-v2 .kp-lay{position:absolute;z-index:2;top:var(--kp-safe-top);bottom:var(--kp-safe-bottom);left:var(--kp-safe-x);right:var(--kp-safe-x);display:flex;flex-direction:column;gap:var(--kp-lay-gap)}
/* logo clear space: its x-height on every side. The flex gap supplies most of it; the margin tops it up where the gap is smaller */
.kp-v2 .kp-lay > .kp-logo:not(:last-child){margin-bottom:max(0px,calc(var(--kp-logo-cs) - var(--kp-lay-gap)))}
.kp-v2 .kp-lay > .kp-logo:not(:first-child){margin-top:max(0px,calc(var(--kp-logo-cs) - var(--kp-lay-gap)))}
.kp-copy{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:22px;min-width:0}
.kp-copy .kp-headline{max-width:100%}
.kp-stage{position:relative;flex:1 1 auto;min-height:0;container-type:size}
.kp-stage.bl-b{margin-bottom:calc(-1 * var(--kp-safe-bottom))}
.kp-stage.bl-t{margin-top:calc(-1 * var(--kp-safe-top))}
.kp-stage.bl-x{margin-inline:calc(-1 * var(--kp-safe-x))}
.kp-stage.bl-r{margin-right:calc(-1 * var(--kp-safe-x))}
.kp-a{position:absolute}
.kp-push{margin-top:auto}

/* flat shapes: palette fills only, no tints, no shadows */
.kp-sh{position:absolute;background:var(--f,var(--k-pink))}
.kp-sh.o{border-radius:50%}
.kp-sh.r{border-radius:36px}
.kp-fill{position:absolute;inset:0}

/* icon placeholder: a disc in an approved icon pairing, dashed ring = the line icon to drop in */
.kp-ico{--d:120px;flex:none;width:var(--d);height:var(--d);border-radius:50%;background:var(--disc);border:4px dashed var(--ring);color:var(--ring);display:grid;place-items:center;text-align:center;padding:calc(var(--d) * .12);font-weight:700;font-size:max(12px,calc(var(--d) * .115));line-height:1.1;letter-spacing:.04em;text-transform:uppercase;overflow:hidden}
.kp-ico.t-w{--disc:var(--k-white);--ring:var(--k-dark-blue)}   /* Dark Blue icon, Pink accent */
.kp-ico.t-s{--disc:var(--k-surface);--ring:var(--k-dark-blue)}
.kp-ico.t-c{--disc:var(--k-cream);--ring:var(--k-dark-blue)}
.kp-ico.t-p{--disc:var(--k-pink);--ring:var(--k-white)}        /* White icon on Pink */
.kp-ico.t-db{--disc:var(--k-dark-blue);--ring:var(--k-light-blue)} /* Light Blue icon, Pink accent */

/* photo and cutout placeholders */
.kp-ph{position:absolute;background:var(--ph,var(--k-light-blue));color:var(--k-dark-blue);outline:4px dashed var(--k-dark-blue);outline-offset:-20px;display:grid;place-items:center;text-align:center;font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;line-height:1.3;padding:34px;overflow:hidden}
.kp-ph span{max-width:26ch}
.kp-ph.lb{--ph:var(--k-light-blue)} .kp-ph.cr{--ph:var(--k-cream)} .kp-ph.pk{--ph:var(--k-pink)} .kp-ph.bl{--ph:var(--k-blue);color:var(--k-white);outline-color:var(--k-white)} .kp-ph.or{--ph:var(--k-orange)} .kp-ph.wh{--ph:var(--k-white)}
.kp-cut{position:absolute;inset:14%;border:4px dashed currentColor;border-radius:24px;display:grid;place-items:center;text-align:center;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;padding:10px;overflow:hidden;color:var(--k-dark-blue)}

/* solid UI card: White, Dark Blue text, flat offset plate for depth */
.kp-ui{--kp-ink:var(--k-dark-blue);--kp-sub:var(--k-dark-blue);--kp-logo:var(--k-logo-pink);background:var(--k-white);color:var(--k-dark-blue);border-radius:36px;box-shadow:16px 16px 0 var(--plate,var(--k-dark-blue));display:flex;flex-direction:column;gap:22px;padding:44px 48px}
.kp-ui.plate-p{--plate:var(--k-pink)} .kp-ui.plate-c{--plate:var(--k-cream)} .kp-ui.plate-lb{--plate:var(--k-light-blue)} .kp-ui.plate-b{--plate:var(--k-blue)} .kp-ui.plate-o{--plate:var(--k-orange)} .kp-ui.plate-w{--plate:var(--k-white)}
.kp-ui .kp-headline{font-size:var(--kp-h1)}
.kp-ui-head{display:flex;align-items:center;gap:28px}
.kp-ui-head .kp-headline{flex:1 1 auto;min-width:0}
.kp-row{display:flex;align-items:center;gap:22px;min-width:0}
.kp-grow{flex:1 1 auto;min-width:0}

/* UI controls, all drawn from shapes, no labels */
.kp-field{position:relative;height:96px;border-radius:22px;background:var(--k-grey-lightest);border:4px solid var(--k-grey-light);display:flex;align-items:center;gap:20px;padding:0 20px}
.kp-caret{width:6px;height:54px;border-radius:3px;background:var(--k-pink)}
.kp-btn{height:96px;border-radius:999px;background:var(--k-pink)}
.kp-send{flex:none;width:96px;height:96px;border-radius:50%;background:var(--k-pink);display:grid;place-items:center}
.kp-send svg{width:46px;height:46px;color:var(--k-white)}
.kp-box{flex:none;width:58px;height:58px;border-radius:14px;border:5px solid currentColor;display:grid;place-items:center}
.kp-box.on{background:var(--k-pink);border-color:var(--k-pink)}
.kp-box svg,.kp-dot svg{width:70%;height:70%;color:var(--k-white)}
.kp-radio{flex:none;width:58px;height:58px;border-radius:50%;border:5px solid currentColor;display:grid;place-items:center}
.kp-radio.on{border-color:var(--k-pink)}
.kp-radio.on::after{content:"";width:28px;height:28px;border-radius:50%;background:var(--k-pink)}
.kp-tog{flex:none;position:relative;width:136px;height:76px;border-radius:999px;background:var(--k-grey-light)}
.kp-tog::after{content:"";position:absolute;top:8px;left:8px;width:60px;height:60px;border-radius:50%;background:var(--k-white)}
.kp-tog.on{background:var(--k-pink)}
.kp-tog.on::after{left:68px}
.kp-segs{display:flex;gap:12px}
.kp-segs i{flex:1 1 0;height:48px;border-radius:12px;background:var(--k-grey-light)}
.kp-segs i.on{background:var(--k-pink)}
.kp-bar{height:22px;border-radius:11px;background:var(--k-grey-light)}
.kp-bar.db{background:var(--k-dark-blue)}
.kp-dot{flex:none;width:var(--d,80px);height:var(--d,80px);border-radius:50%;background:var(--k-pink);display:grid;place-items:center}
.kp-rule{height:4px;background:var(--k-grey-light);border-radius:2px}

/* progress track (board-game journeys): squares only, no numbers */
.kp-track{flex:none;display:flex;gap:14px;color:var(--kp-ink)}
.kp-track i{width:40px;height:40px;border-radius:9px;border:5px solid currentColor}
.kp-track i.on{background:var(--k-pink);border-color:var(--k-pink)}
.kp-theme-pink .kp-track i.on,.kp-theme-orange .kp-track i.on{background:var(--k-dark-blue);border-color:var(--k-dark-blue)}

/* checklist rows made from one copy line (every character kept, in order) */
.kp-join{font-size:var(--kp-body-size);display:flex;flex-direction:column;gap:18px;margin:0}
.kp-join .kp-li{display:flex;align-items:center;gap:22px;font-weight:300;font-size:var(--kp-body-size);line-height:1.25;color:var(--kp-ink)}
.kp-join .kp-li.b{font-weight:700;color:var(--kp-sub)}
.kp-join .kp-box{width:50px;height:50px;border-radius:12px}

/* grids: bingo, tic-tac-toe, icon grids, pickers */
.kp-grid{position:absolute;display:grid;gap:var(--gap,18px)}
.kp-cell{position:relative;border-radius:var(--cr,28px);background:var(--f,var(--k-white));display:grid;place-items:center;overflow:hidden;min-width:0;min-height:0}
.kp-cell.sel{box-shadow:inset 0 0 0 8px var(--k-pink)}
.kp-cell .kp-dot.corner{position:absolute;top:14px;right:14px;--d:64px}

/* picker rows (Stories) */
.kp-pick{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.kp-pick .kp-opt{display:flex;align-items:center;gap:18px;min-height:84px;padding:10px 18px 10px 10px;border-radius:24px;background:var(--k-surface);font-weight:700;font-size:30px;line-height:1.15;color:var(--k-dark-blue);min-width:0}
.kp-pick .kp-thumb{position:relative;flex:none;width:72px;height:72px;border-radius:16px;background:var(--f,var(--k-cream))}
.kp-pick .kp-thumb .kp-cut{inset:6px;border-width:3px;border-radius:10px;font-size:0;padding:0}

/* priority tiles (Stories, 2x2) */
.kp-tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.kp-tile{display:flex;align-items:center;gap:20px;padding:22px 24px;border-radius:28px;background:var(--f,var(--k-white));color:var(--k-dark-blue);font-weight:700;font-size:30px;line-height:1.15;min-height:150px}

/* Venn: two circles, the lens filled with a third color */
.kp-venn{position:absolute;left:50%;top:50%;width:var(--vw);height:var(--vd);transform:translate(-50%,-50%)}
.kp-venn > .c{position:absolute;top:0;width:var(--vd);height:var(--vd);border-radius:50%;overflow:hidden;background:var(--f)}
.kp-venn > .c.l{left:0}
.kp-venn > .c.r{right:0}
.kp-venn .lens{position:absolute;top:0;width:var(--vd);height:var(--vd);border-radius:50%;background:var(--f)}

/* triangle: a solid shape, icons on its corners */
.kp-tri{position:absolute;background:var(--f,var(--k-blue));clip-path:polygon(50% 0,100% 100%,0 100%)}

/* fanned / stacked cards */
.kp-fan{position:absolute;transform-origin:50% 100%;border-radius:36px;background:var(--f,var(--k-white))}
.kp-print{position:absolute;background:var(--k-white);border-radius:14px;padding:22px 22px 70px;box-shadow:14px 14px 0 var(--plate,var(--k-pink))}
.kp-print .kp-ph{position:relative;width:100%;height:100%;outline-offset:-14px;padding:22px;font-size:17px}

/* drawn phone frame */
.kp-phone{position:absolute;background:var(--k-dark-blue);border-radius:72px;padding:26px}
.kp-phone .scr{position:relative;width:100%;height:100%;background:var(--k-white);border-radius:50px;overflow:hidden}
.kp-phone .notch{position:absolute;top:18px;left:50%;width:30%;height:26px;border-radius:13px;background:var(--k-dark-blue);transform:translateX(-50%)}
/* CTA pill that wraps a full-sentence client CTA: pill shape and 34px Bold kept */
.kp-cta.wrap{height:auto;min-height:88px;padding:18px 52px;line-height:1.15;text-align:center;text-wrap:balance;max-width:100%}
/* slider (flexibility): track, fill, knob; stops are icon discs above */
.kp-slider{position:relative;height:40px;border-radius:20px;background:var(--k-grey-light)}
.kp-slider .fill{position:absolute;left:0;top:0;bottom:0;width:var(--v,50%);border-radius:20px;background:var(--k-pink)}
.kp-slider .knob{position:absolute;top:50%;left:var(--v,50%);width:96px;height:96px;border-radius:50%;background:var(--k-pink);border:12px solid var(--k-white);box-shadow:0 0 0 5px var(--k-pink);transform:translate(-50%,-50%)}
/* cutout thumb inside a card */
.kp-thumb-lg{position:relative;flex:none;width:130px;height:130px;border-radius:24px;background:var(--f,var(--k-surface))}
.kp-thumb-lg .kp-cut{inset:10px;font-size:12px;padding:6px}
.kp-v2.kp-tight .kp-lay{--kp-lay-gap:24px}
.kp-v2.kp-tight .kp-copy{gap:18px}
.kp-v2.kp-tight .kp-pick .kp-opt{min-height:72px;padding-block:8px}
.kp-v2.kp-tight .kp-pick .kp-thumb{width:60px;height:60px}
/* copy helpers: a hyphenated word never breaks; U+2026 painted with three brand periods (the OTF's ellipsis glyph is defective) */
.kp-nw{white-space:nowrap}
.kp-ell{position:relative;-webkit-text-fill-color:transparent}
.kp-ell::after{content:"...";position:absolute;left:0;top:0;letter-spacing:.064em;-webkit-text-fill-color:currentColor}
/* END V2 COMPONENTS */
