<title>Katapult Social Templates</title>
<style>
:root{--bg:#f6f6fb;--ink:#131540;--muted:#55577a;--accent:#ED5370;--card:#ffffff;--line:#dcdcea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f2b;--ink:#f2f2fa;--muted:#a9abc8;--card:#17193d;--line:#2a2c55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f2b;--ink:#f2f2fa;--muted:#a9abc8;--card:#17193d;--line:#2a2c55;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-inline:16px}
main{max-width:560px;margin:12vh auto;padding:32px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 8px}
h1{font-size:26px;line-height:1.2;margin:0 0 12px;text-wrap:balance}
p{color:var(--muted);margin:0 0 20px}
a.btn{display:inline-block;background:var(--accent);color:#131540;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:999px}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
<main>
  <p class="eyebrow">Katapult · moved</p>
  <h1>The social templates now live in the Design System</h1>
  <p>T01 to T10, in 1:1, 4:5, 16:9 and 9:16, are in the Templates section of the Katapult Design System, with headlines in Aktiv Grotesk Regular. This page is no longer updated.</p>
  <a class="btn" href="https://claude.ai/code/artifact/ee8bd24b-c2e4-4f39-b14b-4523c87c4704#templates" target="_blank" rel="noopener">Open the templates in the Design System</a>
</main>
